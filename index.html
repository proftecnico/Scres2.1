    <style>
        :root {
            --bg-dark: #090d16;
            --bg-panel: #0f172a;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --accent: #f97316;
            --emerald: #10b981;
            --emerald-dark: #059669;
            --surface: #ffffff;
            --surface-alt: #f8fafc;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 15% 15%, #1e293b 0%, #090d16 65%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #ecf0f1;
            padding: 16px;
            margin: 0;
        }

        /* Contenedor Principal */
        .main-container {
            max-width: 1560px;
            margin: 0 auto;
            border-radius: 24px;
            background: var(--surface-alt);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.65);
            overflow: hidden;
            color: var(--text-main);
            min-height: calc(100vh - 32px);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.6s ease-out;
        }

        /* Pantalla de Login */
        #login-screen {
            min-height: calc(100vh - 32px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            background: radial-gradient(circle at 50% 30%, #1e293b 0%, #090d16 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
            pointer-events: none;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 3rem 2.75rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 100%;
            max-width: 430px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            z-index: 10;
        }

        .brand-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            line-height: 1;
            background: linear-gradient(115deg, #60a5fa 0%, #a78bfa 50%, #f97316 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .brand-version {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            padding: 4px 12px;
            border-radius: 50px;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.35);
        }

        .letter-spacing-2 {
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .login-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.2s;
        }

        .login-input:focus {
            background: rgba(255, 255, 255, 0.09);
            border-color: #60a5fa;
            color: white;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.15);
        }

        .login-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }
